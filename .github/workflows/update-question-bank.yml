name: Update question bank from Excel answers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-question-bank.yml'

permissions:
  contents: write

jobs:
  update-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update answers and switch to 50 questions
        env:
          ANSWERS: 'FULL_MAPPING'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path('bank.html')
          s=p.read_text(encoding='utf-8')
          mapping={str(x['id']):x['answer'] for x in json.loads(os.environ['ANSWERS'])}
          m=re.search(r'const BANK=(\[.*?\]);', s, re.S)
          if not m: raise SystemExit('Không tìm thấy BANK')
          bank=json.loads(m.group(1))
          for q in bank:
              if str(q.get('id')) in mapping: q['answer']=mapping[str(q['id'])]
          s=s[:m.start(1)]+json.dumps(bank,ensure_ascii=False,separators=(',',':'))+s[m.end(1):]
          for a,b in {'30 câu khác nhau':'50 câu khác nhau','<b>30 câu</b>':'<b>50 câu</b>','Danh sách 30 câu':'Danh sách 50 câu','/30':'/50','slice(0,30)':'slice(0,50)','current<29':'current<49','n/30*100':'n/50*100',"s+'/30'":"s+'/50'",'s/30*100':'s/50*100'}.items(): s=s.replace(a,b)
          if 'font-size:27px!important' not in s: s=s.replace('</head>','<style>@media(min-width:801px){.question{font-size:27px!important;line-height:1.6!important}.option{font-size:20px!important;line-height:1.6!important;padding:18px!important}.option input{transform:scale(1.35);margin-right:12px}.feedback{font-size:18px!important;line-height:1.65!important}}</style></head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bank.html
          git diff --cached --quiet || git commit -m 'Cập nhật ngân hàng câu hỏi và đáp án từ Excel, 50 câu mỗi đề'
          git push
