name: Set exam to 50 questions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change exam size from 30 to 50
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bank.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<b>30 câu khác nhau</b>': '<b>50 câu khác nhau</b>',
            '<b>30 câu</b><br>Ngẫu nhiên': '<b>50 câu</b><br>Ngẫu nhiên',
            '</span>/30</b>': '</span>/50</b>',
            'Danh sách 30 câu': 'Danh sách 50 câu',
            '.slice(0,30)': '.slice(0,50)',
            'CÂU ${current+1}/30': 'CÂU ${current+1}/50',
            'current<29': 'current<49',
            '30-Object.keys(answers).length': '50-Object.keys(answers).length',
            'n/30*100': 'n/50*100',
            "s+'/30'": "s+'/50'",
            's/30*100': 's/50*100'
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bank.html
          git diff --cached --quiet || git commit -m 'Tăng số câu thi lên 50 câu'
          git push
