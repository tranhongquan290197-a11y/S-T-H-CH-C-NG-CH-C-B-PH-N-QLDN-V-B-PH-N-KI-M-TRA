<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngân hàng 300 câu hỏi - Sát hạch</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--good:#15803d;--bad:#dc2626}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:#eef2ff;color:#1e40af} button.ghost{background:#f2f4f7;color:#344054}
main{max-width:1200px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:1fr 290px;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.progress{height:9px;background:#e9eef7;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.question{font-size:20px;font-weight:750;line-height:1.45;margin:18px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--text);border:1px solid var(--line);margin:10px 0;padding:14px;border-radius:12px;font-weight:500}
.opt:hover{border-color:#9bb5f5}.opt.selected{border-color:var(--accent);background:#eff6ff}.opt.correct{border-color:#86efac;background:#f0fdf4}.opt.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{margin-top:16px;padding:14px;border-radius:12px;line-height:1.5;display:none}.feedback.show{display:block}.feedback.good{background:#f0fdf4;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}
.nav{display:flex;gap:10px;margin-top:18px}.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.num{background:#f2f4f7;color:#344054;padding:9px 0;border-radius:9px;text-align:center;font-size:13px}.num.current{outline:2px solid var(--accent)}.num.answered{background:#dbeafe;color:#1e40af}.num.correct{background:#dcfce7;color:#166534}.num.wrong{background:#fee2e2;color:#991b1b}
.side-title{font-weight:800;margin-bottom:6px}.small{font-size:13px;color:var(--muted);line-height:1.45}
#result{display:none}.score{font-size:42px;font-weight:850;margin:6px 0}.review{margin-top:16px}.review-item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.review-q{font-weight:750}.tag{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#fee2e2;color:#991b1b}
@media(max-width:850px){main{grid-template-columns:1fr}.side{order:-1}.grid{grid-template-columns:repeat(10,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div><h1>Ngân hàng câu hỏi sát hạch</h1><div class="sub">300 câu • mỗi lượt ngẫu nhiên 50 câu • hoạt động hoàn toàn offline</div></div><button onclick="newExam()">Lượt mới</button></div></header>
<main>
<section class="card">
<div id="exam">
<div class="meta"><span id="counter"></span><span>Không giới hạn thời gian</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="q"></div>
<div id="opts"></div>
<div id="feedback" class="feedback"></div>
<div class="nav"><button class="ghost" onclick="prevQ()">← Câu trước</button><button onclick="nextQ()">Câu tiếp →</button></div>
<button style="width:100%;margin-top:10px;background:#111827" onclick="submitExam()">Nộp bài</button>
</div>
<div id="result">
<h2>Kết quả</h2><div class="score" id="score"></div><div id="summary"></div>
<button style="margin-top:12px" onclick="newExam()">Làm lượt mới</button>
<div class="review"><h3>Xem lại câu sai</h3><div id="review"></div></div>
</div>
</section>
<aside class="card side">
<div class="side-title">Danh sách 50 câu</div><div class="small">Bấm số để chuyển nhanh. Màu xanh/đỏ là kết quả sau khi chọn.</div>
<div class="grid" id="grid"></div>
</aside>
</main>
<script>
const BANK=[{"q": "Áp dụng quản lý rủi ro, ứng dụng công nghệ thông tin và ưu tiên kiểm tra trực tuyến, từ xa trên dữ liệu điện tử.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về nguyên tắc ưu tiên phương thức kiểm tra thuế?", "B": "Ưu tiên kiểm tra trực tiếp tại trụ sở người nộp thuế, sau đó mới sử dụng dữ liệu điện tử để đối chiếu.", "C": "Kiểm tra theo thứ tự đăng ký thuế, không căn cứ rủi ro.", "D": "Lựa chọn hồ sơ chủ yếu theo kinh nghiệm và phương pháp chọn mẫu thủ công."}, "answer": "A", "note": ""}, {"q": "Đánh giá riêng mức tăng, giảm số thuế phải nộp của kỳ được kiểm tra.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về mục đích của hoạt động kiểm tra thuế?", "B": "Đánh giá tính đầy đủ, chính xác, trung thực của việc kê khai, nộp thuế và việc tuân thủ pháp luật về thuế.", "C": "Xác định các sai sót về hóa đơn, chứng từ để phục vụ xử phạt hành chính.", "D": "Đối chiếu số liệu kê khai với dữ liệu quản lý thuế mà không đánh giá việc tuân thủ tổng thể."}, "answer": "C", "note": ""}, {"q": "Chỉ tránh trùng lặp về thời gian tiến hành; nội dung và phạm vi có thể trùng nhau.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về yêu cầu không trùng lặp trong kiểm tra thuế?", "B": "Có thể kiểm tra lại cùng nội dung, phạm vi và thời gian chỉ vì cơ quan quản lý thuế thấy cần thiết.", "C": "Không trùng lặp về nội dung, phạm vi, thời gian giữa cơ quan thanh tra, kiểm tra và Kiểm toán nhà nước, trừ trường hợp có căn cứ cần kiểm tra lại.", "D": "Yêu cầu không trùng lặp chỉ áp dụng giữa các đoàn kiểm tra thuộc cùng một cơ quan thuế."}, "answer": "D", "note": ""}, {"q": "Căn cứ duy nhất vào đề nghị của người nộp thuế.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về căn cứ xây dựng kế hoạch, chuyên đề kiểm tra hằng năm?", "B": "Căn cứ vào thứ tự thành lập doanh nghiệp.", "C": "Căn cứ vào số lao động của cơ quan thuế.", "D": "Cơ quan thuế các cấp căn cứ hướng dẫn của Cục Thuế để xây dựng kế hoạch, chuyên đề kiểm tra."}, "answer": "B", "note": ""}, {"q": "Thuế tỉnh ban hành quyết định giao nhiệm vụ kiểm tra cho Thuế cơ sở.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về thẩm quyền giao nhiệm vụ kiểm tra cho Thuế cơ sở?", "B": "Cục Thuế ban hành quyết định giao nhiệm vụ trực tiếp cho từng Thuế cơ sở.", "C": "Thuế cơ sở tự xác định nhiệm vụ kiểm tra sau khi kế hoạch được phê duyệt.", "D": "Trưởng đoàn kiểm tra ban hành quyết định giao nhiệm vụ cho Thuế cơ sở."}, "answer": "B", "note": ""}, {"q": "Bộ phận kiểm tra tự điều chỉnh danh sách và báo cáo sau khi đã thực hiện.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về yêu cầu khi điều chỉnh kế hoạch để xử lý trùng lặp?", "B": "Phải nêu rõ lý do điều chỉnh và báo cáo cơ quan phê duyệt kế hoạch, chuyên đề để điều chỉnh.", "C": "Chỉ nêu lý do điều chỉnh trong báo cáo kết quả cuối năm.", "D": "Xin ý kiến cơ quan phê duyệt nhưng không cần ban hành văn bản điều chỉnh."}, "answer": "C", "note": ""}, {"q": "Chậm nhất 05 ngày.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về thời hạn công khai kế hoạch, chuyên đề kiểm tra hằng năm?", "B": "Chậm nhất 10 ngày.", "C": "Chậm nhất 30 ngày kể từ ngày ban hành quyết định phê duyệt hoặc điều chỉnh kế hoạch, chuyên đề.", "D": "Chậm nhất 60 ngày."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 3. CĂN CỨ KHOẢN 6 ĐIỀU 88 THÔNG TƯ SỐ 89/2026/TT-BTC: “CHẬM NHẤT LÀ 30 NGÀY KỂ TỪ NGÀY BAN HÀNH QUYẾT ĐỊNH PHÊ DUYỆT HOẶC ĐIỀU CHỈNH KẾ HOẠCH, CHUYÊN ĐỀ KIỂM TRA”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Phân nhóm chủ yếu theo số thuế đã nộp trong năm gần nhất.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, phương án nào phản ánh đúng cách phân nhóm người nộp thuế phục vụ quản lý thuế?", "B": "Phân nhóm theo loại hình pháp lý và số năm hoạt động, không xét mức độ rủi ro.", "C": "Phân nhóm theo số lượng hồ sơ khai thuế và số lần điều chỉnh tờ khai.", "D": "Dựa trên các đặc điểm tương đồng về địa bàn, quy mô, ngành nghề hoạt động và mức độ tuân thủ, rủi ro."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 4. CĂN CỨ KHOẢN 2 ĐIỀU 4 THÔNG TƯ SỐ 89/2026/TT-BTC: “CƠ QUAN THUẾ XÁC ĐỊNH CÁC TIÊU CHÍ PHÂN NHÓM NGƯỜI NỘP THUẾ THEO CÁC ĐẶC ĐIỂM TƯƠNG ĐỒNG VỀ ĐỊA BÀN, QUY MÔ, NGÀNH NGHỀ HOẠT ĐỘNG SẢN XUẤT KINH DOANH”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Phương án kiểm tra phải bảo đảm tuân thủ pháp luật nhưng hạn chế ảnh hưởng không cần thiết đến hoạt động hợp pháp của người nộp thuế.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, nhận định nào giải thích đúng ý nghĩa của nguyên tắc không cản trở hoạt động bình thường?", "B": "Chỉ bố trí kiểm tra ngoài thời gian sản xuất, kinh doanh của người nộp thuế.", "C": "Không yêu cầu cung cấp tài liệu đang được sử dụng cho hoạt động thường xuyên.", "D": "Thu hẹp nội dung kiểm tra trong mọi trường hợp để tránh ảnh hưởng hoạt động."}, "answer": "B", "note": ""}, {"q": "Đánh giá chủ yếu theo tên gọi và điều khoản giá ghi trong hợp đồng giữa các bên.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, phương án nào phản ánh đúng cách xử lý giao dịch liên kết trong tham mưu kiểm tra?", "B": "Đánh giá theo nguyên tắc giao dịch độc lập và bản chất kinh tế của hoạt động, giao dịch phát sinh.", "C": "Chấp nhận mức giá thỏa thuận nếu giao dịch đã có hóa đơn và chứng từ thanh toán.", "D": "Chỉ phân tích giao dịch liên kết khi doanh nghiệp phát sinh lỗ hoặc được hoàn thuế."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 2. CĂN CỨ ĐIỂM Đ KHOẢN 1 ĐIỀU 22 LUẬT QUẢN LÝ THUẾ SỐ 108/2025/QH15: “KIỂM TRA VIỆC XÁC ĐỊNH GIÁ GIAO DỊCH LIÊN KẾT CỦA NGƯỜI NỘP THUẾ THEO NGUYÊN TẮC GIAO DỊCH ĐỘC LẬP VÀ BẢN CHẤT KINH TẾ CỦA HOẠT ĐỘNG, GIAO DỊCH PHÁT SINH”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Áp dụng cùng một biện pháp quản lý cho mọi nhóm để bảo đảm thống nhất.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, nhận định nào giải thích đúng ý nghĩa của việc áp dụng biện pháp quản lý theo mức độ tuân thủ và rủi ro?", "B": "Tập trung kiểm tra nhóm tuân thủ tốt trước vì hồ sơ dễ đối chiếu.", "C": "Nguồn lực và biện pháp quản lý được tập trung phù hợp với từng nhóm người nộp thuế, trong đó nhóm rủi ro cao chịu giám sát, kiểm tra tăng cường.", "D": "Giữ nguyên biện pháp quản lý đã xác định ban đầu dù thông tin rủi ro đã thay đổi."}, "answer": "C", "note": ""}, {"q": "Thực hiện đồng thời tất cả kế hoạch.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, phương án nào phản ánh đúng cách xử lý trùng lặp giữa kế hoạch của cơ quan thuế cấp dưới với cơ quan thanh tra, Kiểm toán nhà nước hoặc cơ quan thuế cấp trên?", "B": "Ưu tiên kế hoạch của cơ quan thuế cấp dưới.", "C": "Tạm dừng cả hai kế hoạch để cơ quan thuế cấp dưới tự lựa chọn phương án thực hiện.", "D": "Thực hiện theo kế hoạch của cơ quan thanh tra, Kiểm toán nhà nước hoặc cơ quan thuế cấp trên."}, "answer": "A", "note": ""}, {"q": "Bảo đảm minh bạch và giúp người nộp thuế, cơ quan quản lý trực tiếp biết kế hoạch đã được phê duyệt hoặc điều chỉnh.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, nhận định nào giải thích đúng ý nghĩa của công khai kế hoạch kiểm tra?", "B": "Cho phép người nộp thuế lựa chọn có tham gia kiểm tra hay không.", "C": "Thay thế việc ban hành quyết định kiểm tra cụ thể.", "D": "Làm mất quyền điều chỉnh kế hoạch của cơ quan thuế."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ KHOẢN 6 ĐIỀU 88 THÔNG TƯ SỐ 89/2026/TT-BTC: “KẾ HOẠCH, CHUYÊN ĐỀ KIỂM TRA HẰNG NĂM ... PHẢI ĐƯỢC CÔNG KHAI TRÊN TRANG THÔNG TIN ĐIỆN TỬ CỦA CƠ QUAN THUẾ HOẶC THÔNG BÁO CHO NGƯỜI NỘP THUẾ VÀ CƠ QUAN THUẾ TRỰC TIẾP QUẢN LÝ NGƯỜI NỘP THUẾ”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Chỉ phục vụ lưu trữ, không dùng để phân tích.", "options": {"A": "Theo Quy trình kiểm tra thuế ban hành kèm Quyết định số 970/QĐ-TCT, nhận định nào giải thích đúng ý nghĩa của việc cập nhật dữ liệu phục vụ công tác kiểm tra thuế?", "B": "Bảo đảm thông tin kịp thời, đầy đủ, chính xác để phân tích rủi ro và lựa chọn hồ sơ kiểm tra.", "C": "Thay thế toàn bộ hồ sơ do người nộp thuế cung cấp.", "D": "Cho phép sử dụng dữ liệu chưa được kiểm chứng để kết luận vi phạm."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 2. CĂN CỨ PHẦN II QUY TRÌNH KIỂM TRA THUẾ BAN HÀNH KÈM QUYẾT ĐỊNH SỐ 970/QĐ-TCT: “CẬP NHẬT KỊP THỜI, ĐẦY ĐỦ VÀ CHÍNH XÁC LÊN CÁC PHẦN MỀM ỨNG DỤNG PHỤC VỤ CÔNG TÁC KIỂM TRA THUẾ”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Áp dụng với các sai sót kê khai nhỏ.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, phương án nào phản ánh đúng trường hợp chuyển hồ sơ kiểm tra sang cơ quan điều tra?", "B": "Áp dụng khi doanh nghiệp đề nghị gia hạn nộp thuế.", "C": "Áp dụng khi qua kiểm tra phát hiện hành vi có dấu hiệu trốn thuế, gian lận thuế đến mức phải truy cứu trách nhiệm hình sự.", "D": "Áp dụng khi người nộp thuế thay đổi địa chỉ."}, "answer": "A", "note": ""}, {"q": "Tổ chức kiểm tra đúng pháp luật và không cản trở hoạt động bình thường của doanh nghiệp.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, trong tình huống sau, một đề xuất kiểm tra dự kiến yêu cầu doanh nghiệp ngừng toàn bộ hoạt động sản xuất trong thời gian đoàn làm việc dù không cần thiết. Cần điều chỉnh đề xuất theo hướng nào?", "B": "Giữ nguyên đề xuất vì yêu cầu tạm dừng hoạt động giúp đoàn kiểm tra thuận lợi hơn.", "C": "Chỉ kiểm tra vào ngày nghỉ, bất kể điều kiện thực tế.", "D": "Hủy kiểm tra vì các kiểm tra đều cản trở doanh nghiệp."}, "answer": "B", "note": ""}, {"q": "Chỉ lưu quyết định điều chỉnh nội bộ, không cần công khai lại kế hoạch.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, sau khi phê duyệt điều chỉnh kế hoạch kiểm tra để loại bỏ một trường hợp trùng lặp, đơn vị dự ": "Toàn bộ thời gian tạm dừng vẫn được tính vào thời hạn kiểm tra.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, phương án nào phản ánh đúng cách tính thời gian tạm dừng kiểm tra?", "B": "Chỉ thời gian tạm dừng do cơ quan thuế đề nghị mới không tính vào thời hạn.", "C": "Thời gian tạm dừng theo thông báo không tính vào thời hạn kiểm tra.", "D": "Khi tạm dừng, cuộc kiểm tra đương nhiên kết thúc và phải ban hành quyết định mới."}, "answer": "D", "note": ""}, {"q": "Không quá 02 lần trong 01 tháng.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về giới hạn số lần kiểm tra trong một năm đối với trường hợp lựa chọn theo kế hoạch, chuyên đề?", "B": "Có thể kiểm tra nhiều lần trong năm nếu thuộc cùng kế hoạch hoặc chuyên đề.", "C": "Chỉ được kiểm tra 01 lần trong 05 năm.", "D": "Không quá 01 lần trong 01 năm, trừ trường hợp kiểm tra lại theo quy định."}, "answer": "C", "note": ""}, {"q": "Thủ trưởng cơ quan quản lý thuế các cấp.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về thẩm quyền ban hành quyết định kiểm tra?", "B": "Trưởng đoàn kiểm tra.", "C": "Trưởng bộ phận kiểm tra của cơ quan thuế.", "D": "Công chức được giao nhiệm vụ kiểm tra."}, "answer": "A", "note": ""}, {"q": "Loại khỏi hồ sơ các tài liệu được cho là không cần thiết cho nội dung kiểm tra.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về quyền của trưởng đoàn kiểm tra đối với tài liệu, hàng hóa?", "B": "Quyết định niêm phong khi có căn cứ cho rằng có vi phạm pháp luật trong lĩnh vực thuế.", "C": "Tạm giữ hàng hóa cho đến khi kết thúc cuộc kiểm tra.", "D": "Niêm phong khi tài liệu, hàng hóa có giá trị lớn dù chưa xác định dấu hiệu vi phạm."}, "answer": "B", "note": ""}, {"q": "Biên bản kiểm tra có giá trị như quyết định xử phạt.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về giá trị của biên bản kiểm tra khi xác định rõ hành vi vi phạm hành chính?", "B": "Phải lập thêm biên bản vi phạm hành chính riêng cho cùng hành vi.", "C": "Biên bản kiểm tra được xác định là biên bản vi phạm hành chính.", "D": "Biên bản kiểm tra chỉ là tài liệu tổng hợp, không dùng làm căn cứ xử phạt."}, "answer": "B", "note": ""}, {"q": "06 tháng.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về thời hiệu kiểm tra lại?", "B": "05 năm.", "C": "Không có thời hiệu.", "D": "02 năm kể từ ngày ký kết luận kiểm tra hoặc quyết định xử lý vi phạm hành chính về quản lý thuế."}, "answer": "D", "note": ""}, {"q": "Không quá 02 lần.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về số lần tối đa cơ quan thuế thông báo giải trình, bổ sung đối với mỗi hồ sơ khai thuế?", "B": "Không quá 01 lần.", "C": "Không quá 03 lần.", "D": "Có thể kiểm tra nhiều lần trong năm nếu thuộc cùng kế hoạch hoặc chuyên đề."}, "answer": "B", "note": ""}, {"q": "Không quá 03 ngày.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về thời hạn kiểm tra theo quyết định tại trụ sở cơ quan thuế?", "B": "Không quá 10 ngày làm việc.", "C": "Không quá 20 ngày.", "D": "Không quá 40 ngày."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 2. CĂN CỨ ĐIỂM G KHOẢN 3 ĐIỀU 87 THÔNG TƯ SỐ 89/2026/TT-BTC: “THỜI HẠN KIỂM TRA KHÔNG QUÁ 10 NGÀY LÀM VIỆC”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Trong ngày ký.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về thời hạn gửi quyết định kiểm tra cho người nộp thuế?", "B": "05 ngày làm việc.", "C": "03 ngày làm việc kể từ ngày ký.", "D": "10 ngày làm việc."}, "answer": "A", "note": ""}, {"q": "03 ngày làm việc.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về thời hạn công bố quyết định kiểm tra?", "B": "20 ngày làm việc.", "C": "30 ngày làm việc.", "D": "10 ngày làm việc kể từ ngày ban hành, trừ trường hợp bãi bỏ hoặc hoãn."}, "answer": "B", "note": ""}, {"q": "Việc kiểm tra tại trụ sở người nộp thuế được ghi nhật ký điện tử.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về yêu cầu về nhật ký kiểm tra?", "B": "Chỉ trưởng đoàn ghi nhật ký; thành viên không phải ghi.", "C": "Đoàn có thể dùng sổ nhật ký giấy thay cho nhật ký điện tử.", "D": "Chỉ ghi nhật ký tại ngày công bố và ngày kết thúc kiểm tra."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ ĐIỂM H KHOẢN 7 ĐIỀU 88 THÔNG TƯ SỐ 89/2026/TT-BTC: “VIỆC KIỂM TRA TẠI TRỤ SỞ NGƯỜI NỘP THUẾ ĐƯỢC GHI NHẬT KÝ ĐIỆN TỬ”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Chỉ các đoàn kiểm tra đối với người nộp thuế được xếp hạng rủi ro cao.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về phạm vi giám sát đoàn kiểm tra?", "B": "Tất cả các đoàn kiểm tra thuế tại trụ sở người nộp thuế.", "C": "Chỉ các đoàn kiểm tra có gia hạn hoặc điều chỉnh quyết định kiểm tra.", "D": "Chỉ các đoàn kiểm tra do cơ quan thuế cấp tỉnh thành lập."}, "answer": "A", "note": ""}, {"q": "Cho phép cơ quan thuế phân tích hồ sơ và dữ liệu sẵn có trước khi yêu cầu người nộp thuế giải trình hoặc chuyển bước xử lý.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, nhận định nào giải thích đúng ý nghĩa của kiểm tra tại trụ sở cơ quan thuế được thực hiện trên cơ sở hồ sơ thuế trên hệ thống thông tin quản lý thuế?", "B": "Cho phép cơ quan thuế kết luận ngay nghĩa vụ thuế chỉ từ một chỉ tiêu bất thường trên hệ thống.", "C": "Thay thế hoàn toàn việc yêu cầu người nộp thuế giải trình, bổ sung tài liệu.", "D": "Chỉ phục vụ thống kê số lượng hồ sơ đã nộp, không dùng để đánh giá rủi ro."}, "answer": "A", "note": ""}, {"q": "Để kéo dài kiểm tra không giới hạn.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về lý do thời gian tạm dừng không tính vào thời hạn kiểm tra tại trụ sở người nộp thuế?", "B": "Để tách thời gian đoàn không thể thực hiện kiểm tra do lý do được thông báo khỏi thời gian làm việc thực tế của cuộc kiểm tra.", "C": "Để đương nhiên gia hạn mà không cần quyết định.", "D": "Để bỏ yêu cầu ghi nhận thời gian kiểm tra."}, "answer": "D", "note": ""}, {"q": "Hai trường hợp có thời hạn hoàn toàn giống nhau.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, phương án nào phản ánh đúng phân biệt thời hạn kiểm tra thông thường và doanh nghiệp có giao dịch liên kết?", "B": "Giao dịch liên kết không có giới hạn thời gian.", "C": "Doanh nghiệp có giao dịch liên kết có thời hạn tối đa dài hơn do tính chất phân tích phức tạp, nhưng vẫn chỉ được gia hạn 01 lần trong giới hạn tương ứng.", "D": "Doanh nghiệp thông thường luôn có thời hạn dài hơn."}, "answer": "D", "note": ""}, {"q": "Thành viên tự quyết định toàn bộ phạm vi kiểm tra.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, phương án nào phản ánh đúng mối quan hệ giữa trưởng đoàn và thành viên đoàn kiểm tra tại trụ sở người nộp thuế?", "B": "Trưởng đoàn không được yêu cầu báo cáo.", "C": "Mọi thành viên có thẩm quyền ban hành quyết định kiểm tra.", "D": "Trưởng đoàn tổ chức, chỉ đạo; thành viên thực hiện nhiệm vụ được phân công và báo cáo kết quả cho trưởng đoàn."}, "answer": "B", "note": ""}, {"q": "Là cơ chế cấp trên kiểm tra lại vụ việc đã có kết luận hoặc quyết định xử lý khi thuộc các trường hợp theo luật định.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, quy định nào sau đây đúng về bản chất của kiểm tra lại?", "B": "Là kiểm tra định kỳ hằng năm.", "C": "Là quyền tự chọn của các thành viên đoàn cũ.", "D": "Là bước bắt buộc sau các cuộc kiểm tra."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ KHOẢN 6 ĐIỀU 22 LUẬT QUẢN LÝ THUẾ SỐ 108/2025/QH15: “CƠ QUAN THUẾ THỰC HIỆN KIỂM TRA LẠI ĐỐI VỚI CÁC VỤ VIỆC ĐÃ ĐƯỢC KẾT LUẬN, BAN HÀNH QUYẾT ĐỊNH ... TRONG CÁC TRƯỜNG HỢP”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Gia hạn thêm thời gian giải trình của thông báo lần 1 mà không ban hành thông báo mới.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về mục đích của thông báo giải trình lần 2 khi kiểm tra tại trụ sở cơ quan thuế?", "B": "Tạo cơ hội làm rõ thêm khi giải trình lần 1 chưa đủ căn cứ chứng minh nội dung khai thuế chính xác.", "C": "Thay thế quyết định kiểm tra tại trụ sở người nộp thuế.", "D": "Yêu cầu bổ sung tài liệu đối với hồ sơ đã được chấp nhận đầy đủ."}, "answer": "B", "note": ""}, {"q": "Để tập trung kiểm tra đúng phạm vi rủi ro đã xác định và hạn chế mở rộng tùy tiện, trừ kiểm tra hoàn thuế.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, vì sao quyết định kiểm tra tại trụ sở người nộp thuế phải xác định rõ nội dung và thời kỳ có rủi ro?", "B": "Để kiểm tra toàn bộ các kỳ thuế không cần căn cứ.", "C": "Để người nộp thuế tự chọn nội dung.", "D": "Để thay thế kế hoạch kiểm tra hằng năm."}, "answer": "A", "note": ""}, {"q": "Xóa bỏ nghĩa vụ thuế của doanh nghiệp.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về bản chất của việc bãi bỏ quyết định kiểm tra do trùng lặp?", "B": "Ngăn cơ quan thuế tiếp tục một cuộc kiểm tra có nội dung, kỳ kiểm tra đã thuộc quyết định của cơ quan có thẩm quyền khác.", "C": "Cấm kiểm tra lại trong các trường hợp.", "D": "Thay đổi kết luận của cơ quan khác."}, "answer": "C", "note": ""}, {"q": "Chỉ kiểm tra việc chấp hành thời gian làm việc của các thành viên đoàn.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, nhận định nào giải thích đúng ý nghĩa của giám sát thường xuyên đoàn kiểm tra?", "B": "Thay thế trách nhiệm chỉ đạo, kiểm soát của trưởng đoàn kiểm tra.", "C": "Bảo đảm hoạt động đoàn từ công bố đến kết thúc tuân thủ pháp luật, chính xác, khách quan, công khai, dân chủ và kịp thời.", "D": "Chỉ được thực hiện khi người nộp thuế có đơn phản ánh về đoàn kiểm tra."}, "answer": "C", "note": ""}, {"q": "Cho phép xóa toàn bộ dữ liệu kiểm tra.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, nhận định nào giải thích đúng ý nghĩa của lưu trữ hồ sơ điện tử sau kiểm tra trực tuyến, từ xa?", "B": "Không cần lưu biên bản đã ký.", "C": "Cổng giao tiếp phải mở vĩnh viễn.", "D": "Bảo đảm văn bản, dữ liệu làm căn cứ xử lý kết quả được lưu trong hồ sơ điện tử và cổng giao tiếp được đóng khi kết thúc."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 4. CĂN CỨ KHOẢN 3 ĐIỀU 89 THÔNG TƯ SỐ 89/2026/TT-BTC: “CÁC VĂN BẢN, TÀI LIỆU, DỮ LIỆU ĐIỆN TỬ LÀ CĂN CỨ XỬ LÝ KẾT QUẢ KIỂM TRA ĐƯỢC LƯU TRỮ HỒ SƠ ĐIỆN TỬ. CỔNG GIAO TIẾP ĐIỆN TỬ ... ĐƯỢC ĐÓNG KHI KẾT THÚC KIỂM TRA”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Khi dữ liệu điện tử chưa đủ căn cứ kết luận và cần xác minh thực tế tại trụ sở người nộp thuế.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, quy định nào sau đây đúng về khi nào phải chuyển từ kiểm tra điện tử sang trực tiếp?", "B": "Khi người nộp thuế nộp hồ sơ đúng hạn.", "C": "Khi đoàn đã có đủ căn cứ kết luận.", "D": "Trong các cuộc kiểm tra điện tử."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ KHOẢN 4 ĐIỀU 89 THÔNG TƯ SỐ 89/2026/TT-BTC: “DỮ LIỆU ĐIỆN TỬ CHƯA ĐỦ CĂN CỨ ĐỂ KẾT LUẬN, CẦN XÁC MINH THỰC TẾ THÌ CƠ QUAN THUẾ THỰC HIỆN KIỂM TRA TRỰC TIẾP TẠI TRỤ SỞ NGƯỜI NỘP THUẾ”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Xác định sơ bộ số thuế truy thu và mức phạt trước khi ban hành quyết định kiểm tra.", "options": {"A": "Theo Quy trình kiểm tra thuế ban hành kèm Quyết định số 970/QĐ-TCT, nhận định nào giải thích đúng ý nghĩa của phiếu phân tích, đánh giá rủi ro?", "B": "Xác định nội dung và thời kỳ có rủi ro làm cơ sở tổ chức kiểm tra.", "C": "Thay thế quyết định kiểm tra và biên bản phân công công việc của đoàn.", "D": "Chỉ tổng hợp thông tin chung về doanh thu, không xác định nội dung hoặc thời kỳ rủi ro."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 2. CĂN CỨ MẪU SỐ 06/QTKT KÈM QUYẾT ĐỊNH SỐ 970/QĐ-TCT: “PHIẾU PHÂN TÍCH, ĐÁNH GIÁ RỦI RO XÁC ĐỊNH NỘI DUNG, THỜI KỲ RỦI RO”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Chỉ ghi nhận thời gian làm việc và thành phần tham dự của đoàn kiểm tra.", "options": {"A": "Theo Quy trình kiểm tra thuế ban hành kèm Quyết định số 970/QĐ-TCT, quy định nào sau đây đúng về vai trò của biên bản xác nhận số liệu kiểm tra?", "B": "Thay thế biên bản kiểm tra và kết luận xử lý cuối cùng của cơ quan thuế.", "C": "Ghi nhận số liệu, nội dung đã đối chiếu và xác nhận trong quá trình kiểm tra để làm căn cứ tổng hợp kết quả.", "D": "Chỉ ghi ý kiến giải trình của người nộp thuế, không xác nhận số liệu đã đối chiếu."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 3. CĂN CỨ MẪU SỐ 09/QTKT KÈM QUYẾT ĐỊNH SỐ 970/QĐ-TCT: “BIÊN BẢN XÁC NHẬN SỐ LIỆU KIỂM TRA”. PHƯƠNG ÁN ĐÚNG PHẢI THỂ HIỆN ĐẦY ĐỦ NỘI DUNG CỦA QUY ĐỊNH ĐƯỢC TRÍCH DẪN.", "note": ""}, {"q": "Ban hành thông báo lần 2 để người nộp thuế tiếp tục giải trình, bổ sung hoặc khai bổ sung trong 10 ngày làm việc.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, khi kiểm tra tại trụ sở cơ quan thuế, sau giải trình lần 1, tài liệu vẫn chưa đủ chứng minh số thuế khai đúng. Công chức kiểm tra nên thực hiện bước nào?", "B": "Ấn định thuế ngay mà không xem xét thêm.", "C": "Kết thúc hồ sơ và chấp nhận số khai.", "D": "Ban hành quyết định cưỡng chế ngay."}, "answer": "B", "note": ""}, {"q": "Tiếp tục gửi thêm thông báo giải trình cho đến khi người nộp thuế phản hồi.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, khi kiểm tra tại trụ sở cơ quan thuế, hết thời hạn thông báo lần 2, người nộp thuế không giải trình; cơ quan thuế có đủ căn cứ ấn định số thuế phải nộp. Hướng xử lý phù hợp là gì?", "B": "Thực hiện ấn định số thuế phải nộp theo căn cứ đã có.", "C": "Bắt buộc chuyển sang kiểm tra tại trụ sở người nộp thuế dù căn cứ ấn định đã đầy đủ.", "D": "Tạm dừng xử lý số chênh lệch cho đến kỳ kiểm tra tiếp theo."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 2. CĂN CỨ ĐIỂM Đ KHOẢN 3 ĐIỀU 87 THÔNG TƯ SỐ 89/2026/TT-BTC: “CƠ QUAN THUẾ ẤN ĐỊNH SỐ THUẾ PHẢI NỘP NẾU CÓ ĐỦ CĂN CỨ ẤN ĐỊNH”. ĐỦ CĂN CỨ ẤN ĐỊNH THÌ KHÔNG CẦN CHUYỂN BƯỚC CHỈ ĐỂ THU THẬP LẠI CÙNG NỘI DUNG.", "note": ""}, {"q": "Ấn định số thuế theo ước đoán.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, khi kiểm tra tại trụ sở cơ quan thuế, hết thời hạn thông báo lần 2, người nộp thuế không chứng minh được số thuế khai đúng và cơ quan thuế chưa đủ căn cứ ấn định. Hướng xử lý nào phù hợp?", "B": "Chấp nhận hồ sơ vì chưa đủ căn cứ xử lý.", "C": "Ban hành quyết định kiểm tra tại trụ sở người nộp thuế hoặc đưa vào kế hoạch kiểm tra theo quản lý rủi ro.", "D": "Xóa hồ sơ khai thuế khỏi hệ thống."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 3. CĂN CỨ ĐIỂM Đ KHOẢN 3 ĐIỀU 87 THÔNG TƯ SỐ 89/2026/TT-BTC: “TRONG TRƯỜNG HỢP KHÔNG ĐỦ CĂN CỨ ẤN ĐỊNH ... BAN HÀNH QUYẾT ĐỊNH KIỂM TRA TẠI TRỤ SỞ NGƯỜI NỘP THUẾ HOẶC LÀM CƠ SỞ ĐỂ XÂY DỰNG KẾ HOẠCH KIỂM TRA”. KHI CHƯA ĐỦ CĂN CỨ ẤN ĐỊNH, CẦN CHUYỂN SANG PHƯƠNG THỨC KIỂM TRA PHÙ HỢP ĐỂ THU THẬP THÊM CĂN CỨ.", "note": ""}, {"q": "Vẫn công bố và kiểm tra đồng thời.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, đã ban hành quyết định kiểm tra tại trụ sở người nộp thuế nhưng phát hiện nội dung và kỳ kiểm tra trùng với quyết định thanh tra của cơ quan có thẩm quyền. Cơ quan thuế phải làm gì?", "B": "Chỉ đổi tên đoàn kiểm tra.", "C": "Tạm dừng đến khi có kết quả xử lý nhưng giữ nguyên quyết định.", "D": "Ban hành quyết định bãi bỏ quyết định kiểm tra."}, "answer": "C", "note": ""}, {"q": "Xem xét lý do chính đáng và thông báo hoãn trước khi công bố quyết định kiểm tra.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, trước ngày công bố quyết định kiểm tra tại trụ sở người nộp thuế, doanh nghiệp có văn bản đề nghị hoãn vì người đại diện đang điều trị ung thư, nêu rõ lý do và thời gian hoãn. Cơ quan thuế xử lý thế nào?", "B": "Chỉ chấp nhận hoãn nếu người nộp thuế đề nghị sau khi đã công bố quyết định kiểm tra.", "C": "Tạm dừng vô thời hạn mà không cần xác định thời điểm tiếp tục kiểm tra.", "D": "Giữ nguyên ngày công bố và chỉ ghi nhận đề nghị hoãn trong hồ sơ."}, "answer": "D", "note": ""}, {"q": "Đoàn tự kéo dài thêm 30 ngày.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, trong tình huống sau, cuộc kiểm tra tại trụ sở người nộp thuế thông thường đã thực hiện 20 ngày và thực sự cần thêm thời gian. Phương án đúng là gì?", "B": "Trình người có thẩm quyền gia hạn 01 lần, thời gian gia hạn không quá 20 ngày.", "C": "Gia hạn nhiều lần đến khi xong.", "D": "Không cần quyết định gia hạn."}, "answer": "D", "note": ""}, {"q": "Yêu cầu người nộp thuế tự bảo quản tài liệu và cam kết không thay đổi, không cần biện pháp khác.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, trong tình huống sau, đoàn kiểm tra phát hiện tài liệu có dấu hiệu bị tẩu tán và có căn cứ cho rằng liên quan vi phạm thuế. Trưởng đoàn có thể áp dụng biện pháp nào?", "B": "Tạm giữ toàn bộ tài liệu của doanh nghiệp mà không xác định phạm vi và không lập biên bản.", "C": "Quyết định niêm phong tài liệu theo quy định.", "D": "Sao chụp tài liệu rồi trả lại ngay, kể cả khi nguy cơ tẩu tán chứng cứ vẫn còn."}, "answer": "B", "note": ""}, {"q": "Báo cáo thủ trưởng cơ quan thuế trong thời hạn 05 ngày làm việc kể từ ngày phát hiện.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, đoàn kiểm tra phát hiện hành vi trốn thuế có thể đến mức truy cứu trách nhiệm hình sự vào ngày 10/10. Nghĩa vụ trước mắt của đoàn là gì?", "B": "Chờ đến khi kết thúc toàn bộ cuộc kiểm tra.", "C": "Lập hồ sơ và trực tiếp quyết định chuyển vụ việc sang xử lý hình sự.", "D": "Chỉ thông báo miệng cho người nộp thuế."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ ĐIỂM G.2 KHOẢN 7 ĐIỀU 88 THÔNG TƯ SỐ 89/2026/TT-BTC: “TRONG THỜI HẠN 05 NGÀY LÀM VIỆC KỂ TỪ NGÀY PHÁT HIỆN, ĐOÀN KIỂM TRA CÓ TRÁCH NHIỆM BÁO CÁO THỦ TRƯỞNG CƠ QUAN THUẾ”. QUY ĐỊNH ĐẶT RA THỜI HẠN BÁO CÁO SỚM ĐỂ THỦ TRƯỞNG XEM XÉT CHUYỂN HỒ SƠ.", "note": ""}, {"q": "Vẫn công bố để kiểm tra lại toàn bộ.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, trước khi công bố quyết định kiểm tra tại trụ sở người nộp thuế trong trường hợp sau thời hạn thông báo giải trình lần 2, doanh nghiệp chứng minh được số thuế đã khai đúng và nộp đủ số thuế phải nộp. Cách xử lý phù hợp nhất?", "B": "Chỉ hoãn nhưng giữ quyết định đến khi có kết quả xử lý.", "C": "Bãi bỏ quyết định kiểm tra trên các căn cứ tương ứng và lưu đầy đủ tài liệu chứng minh.", "D": "Xóa dữ liệu giải trình vì không còn kiểm tra."}, "answer": "C", "note": ""}, {"q": "Không được kiểm tra lại vì đã quá 01 năm.", "options": {"A": "Theo Luật Quản lý thuế số 108/2025/QH15, trong tình huống sau, kết luận kiểm tra đã ký 18 tháng, sau đó phát hiện trưởng đoàn cố ý làm sai lệch hồ sơ và kết luận trái pháp luật. Cơ quan cấp trên nên xử lý thế nào?", "B": "Chỉ yêu cầu đoàn cũ tự sửa biên bản.", "C": "Chờ đủ 05 năm mới kiểm tra lại.", "D": "Ban hành kiểm tra lại vì có căn cứ luật định và vẫn trong thời hiệu 02 năm."}, "answer": "A", "note": ""}, {"q": "Chuyển sang kiểm tra trực tiếp đối với nội dung cần xác minh thực tế, tiếp tục sử dụng và lưu hồ sơ điện tử đã hợp lệ cho phần còn lại.", "options": {"A": "Theo Thông tư số 89/2026/TT-BTC, trong tình huống sau, cuộc kiểm tra điện tử đã lập hồ sơ ký số nhưng phát hiện cần kiểm kê thực tế một phần hàng hóa; phần còn lại dữ liệu đã đầy đủ. Cách tổ chức phù hợp nhất?", "B": "Hủy toàn bộ hồ sơ điện tử và làm lại từ đầu.", "C": "Kết luận toàn bộ chỉ bằng dữ liệu điện tử.", "D": "Mở rộng kiểm tra trực tiếp sang các nội dung không có rủi ro."}, "answer": "ĐÁP ÁN ĐÚNG LÀ PHƯƠNG ÁN 1. CĂN CỨ KHOẢN 2, KHOẢN 3 VÀ KHOẢN 4 ĐIỀU 89 THÔNG TƯ SỐ 89/2026/TT-BTC: “HỒ SƠ ... ĐƯỢC KÝ ĐIỆN TỬ ... LƯU TRỮ HỒ SƠ ĐIỆN TỬ ... DỮ LIỆU ĐIỆN TỬ CHƯA ĐỦ CĂN CỨ ... THỰC HIỆN KIỂM TRA TRỰC TIẾP”. PHẢI BẢO TOÀN GIÁ TRỊ HỒ SƠ ĐIỆN TỬ VÀ CHỈ XÁC MINH TRỰC TIẾP PHẦN DỮ LIỆU CHƯA ĐỦ CĂN CỨ.", "note" iệp kia", "D": "Một doanh nghiệp nắm giữ trực tiếp hoặc gián tiếp ít nhất 15% vốn góp của chủ sở hữu của doanh nghiệp kia"}, "answer": "TRUNG BÌNH", "note": ""}, {"q": "Chi phí thanh toán cho bên liên kết không thực hiện bất kỳ hoạt động sản xuất, kinh doanh nào liên quan đến ngành nghề, hoạt động sản xuất, kinh doanh của người nộp thuế; không có quyền lợi, trách nhiệm liên quan đối với tài sản, hàng hóa, dịch vụ cung cấp cho người nộp thuế", "options": {"A": "Theo Nghị định 255/2026/NĐ-CP, không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp trong kỳ chi phí nào?", "B": "Chi phí thanh toán cho bên liên kết có hoạt động sản xuất, kinh doanh nhưng quy mô tài sản, số lượng nhân viên và chức năng sản xuất, kinh doanh không tương xứng với giá trị giao dịch mà bên liên kết nhận được từ người nộp thuế", "C": "Chi phí thanh toán cho bên liên kết là đối tượng cư trú của một nước hoặc vùng lãnh thổ không thu thuế thu nhập doanh nghiệp, không góp phần tạo ra doanh thu, giá trị gia tăng cho hoạt động sản xuất, kinh doanh của người nộp thuế", "D": "Cả 3 đáp án trên đều đúng"}, "answer": "TRUNG BÌNH", "note": ""}, {"q": "Tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ cộng chi phí khấu hao phát sinh trong kỳ của người nộp thuế", "options": {"A": "Theo Nghị định 255/2026/NĐ-CP, Tổng chi phí lãi vay được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp đối với doanh nghiệp có giao dịch liên kết được xác định như thế nào?", "B": "Tổng chi phí lãi vay phát sinh trong kỳ của người nộp thuế được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh trong kỳ cộng chi phí lãi vay sau khi trừ lãi tiền gửi let exam=[], idx=0, answers={}, submitted=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function sample50(){return [...BANK].sort(()=>Math.random()-.5).slice(0,50)}
function newExam(){exam=sample50();idx=0;answers={};submitted=false;document.getElementById('exam').style.display='block';document.getElementById('result').style.display='none';render()}
function render(){
 const x=exam[idx], chosen=answers[idx], correct=x.answer;
 document.getElementById('counter').textContent=`Câu ${idx+1}/50`;
 document.getElementById('bar').style.width=((idx+1)/50*100)+'%';
 document.getElementById('q').innerHTML=esc(x.q);
 const box=document.getElementById('opts'); box.innerHTML='';
 for(const k of ['A','B','C','D']){
   const b=document.createElement('button'); b.className='opt '+(chosen===k?'selected ':'')+
     (chosen && k===correct?'correct ':'')+(chosen && chosen===k && chosen!==correct?'wrong':'');
   b.innerHTML=`<b>${k}.</b> ${esc(x.options[k])}`; b.onclick=()=>choose(k); box.appendChild(b);
 }
 const f=document.getElementById('feedback');
 if(chosen){f.className='feedback show '+(chosen===correct?'good':'bad');f.innerHTML=`<b>${chosen===correct?'Đúng':'Sai'}</b> — Đáp án đúng: <b>${esc(correct)}</b>${x.note?`<br><b>Căn cứ:</b> ${esc(x.note)}`:''}`}
 else f.className='feedback';
 renderGrid();
}
function choose(k){if(submitted)return;answers[idx]=k;render()}
function prevQ(){if(idx>0){idx--;render()}}
function nextQ(){if(idx<49){idx++;render()}else{window.scrollTo({top:0,behavior:'smooth'})}}
function renderGrid(){
 const g=document.getElementById('grid');g.innerHTML='';
 exam.forEach((x,i)=>{const d=document.createElement('button');d.className='num '+(i===idx?'current ':'')+(answers[i]?'answered ':'');
   if(answers[i]) d.className+=(answers[i]===x.answer?'correct':'wrong');
   d.textContent=i+1;d.onclick=()=>{idx=i;render()};g.appendChild(d)})
}
function submitExam(){
 if(submitted)return; submitted=true;
 let correct=0; exam.forEach((x,i)=>{if(answers[i]===x.answer)correct++});
 document.getElementById('exam').style.display='none';document.getElementById('result').style.display='block';
 document.getElementById('score').textContent=`${correct}/50`;
 document.getElementById('summary').textContent=`Tỷ lệ: ${(correct/50*100).toFixed(1)}% • Đã trả lời: ${Object.keys(answers).length}/50`;
 const r=document.getElementById('review');r.innerHTML='';
 exam.forEach((x,i)=>{if(answers[i]!==x.answer){const d=document.createElement('div');d.className='review-item';d.innerHTML=`<span class="tag">Câu ${i+1}</span><div class="review-q">${esc(x.q)}</div><div>Bạn chọn: <b>${esc(answers[i]||'Chưa chọn')}</b> • Đúng: <b>${esc(x.answer)}</b></div>${x.note?`<div style="margin-top:6px"><b>Căn cứ:</b> ${esc(x.note)}</div>`:''}`;r.appendChild(d)}})
 if(!r.children.length)r.innerHTML='<div class="small">Không có câu sai. Tuyệt vời!</div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
newExam();
</script>
