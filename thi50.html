<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07549a"><title>Thi sát hạch – 50 câu</title><style>body{font-family:Arial;background:#f3f7fb}</style></head><body><div style="padding:25px;text-align:center;color:#07549a;font-weight:800">Đang cập nhật đề 50 câu…</div><script>
const CH={"155":["D"],"170":["A"],"230":["A"],"355":["B"],"364":["C"],"416":["A","C"],"417":["A","B"],"419":["A","B"],"427":["A","D"],"431":["A"],"436":["A"],"437":["A"],"440":["D"],"442":["A","C"],"443":["C"],"444":["C"],"445":["B","C"],"446":["C"],"451":["A"],"452":["B","C"],"453":["A","C"],"454":["B","D"],"455":["C"],"511":["B"],"518":["C"],"525":["C"]};
function patchAnswers(t){for(const [id,a] of Object.entries(CH)){const re=new RegExp('(\\{\"id\":'+id+',.*?\"answer\":\")([^\"]+)(\")','s');t=t.replace(re,'$1'+a.join(',')+'$3')}return t}
function appScript(){return `const TOTAL=50,L=[\"A\",\"B\",\"C\",\"D\"];let exam=[],answers=Array(TOTAL).fill(null),current=0,submitted=false;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc2(s){return String(s).replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#039;\"}[m]))}function norm(x){return String(x||\"\").split(\",\").filter(Boolean)}function isRight(sel,x){return sel&&sel.slice().sort().join(\",\")==norm(x.answer).slice().sort().join(\",\")}function startExam(){exam=shuffle(BANK).slice(0,TOTAL);answers=Array(TOTAL).fill(null);current=0;submitted=false;document.getElementById(\"start\").classList.add(\"hidden\");document.getElementById(\"exam\").classList.remove(\"hidden\");renderNav();renderQuestion();update()}function renderNav(){document.getElementById(\"nav\").innerHTML=exam.map((x,i)=>\`<button id=\"n\${i}\" onclick=\"go(\${i})\">\${i+1}</button>\`).join(\"\");nav()}function nav(){exam.forEach((x,i)=>{let b=document.getElementById(\"n\"+i);if(!b)return;b.className=(answers[i]?(isRight(answers[i].split(\",\"),x)?\"done\":\"wrong\"):\"\")+(i===current?\" cur\":\"\")})}function renderQuestion(){let x=exam[current],chosen=answers[current],multi=norm(x.answer).length>1,sel=chosen?norm(chosen):[],opts=x.options.map((o,i)=>\`<label class=\"option\"><input type=\"\${multi?\"checkbox\":\"radio\"}\" name=\"a\" value=\"\${L[i]}\" \${sel.includes(L[i])?\"checked\":\"\"} \${chosen?\"disabled\":\"\"}><b>\${L[i]}.</b> \${esc2(o)}</label>\`).join(\"\");let fb=chosen?\`<div class=\"feedback \${isRight(sel,x)?\"ok\":\"no\"}\"><b>\${isRight(sel,x)?\"✓ Chính xác\":\"✗ Chưa chính xác\"}</b><p>Bạn chọn: <b>\${sel.join(\", \")||\"Chưa chọn\"}</b> · Đáp án đúng: <b>\${norm(x.answer).join(\", \")}</b></p><p><b>Giải thích:</b> \${esc2(x.basis||\"\")}</p><p><b>Căn cứ:</b> \${esc2(x.basis||\"\")}</p></div>\`:\"\";document.getElementById(\"qbox\").innerHTML=\`<div><b>CÂU \${current+1}/50</b></div><div class=\"question\">\${esc2(x.q)}</div>\${opts}\${multi&&!chosen?\'<button class=\"primary\" style=\"margin-top:10px\" onclick=\"confirmMulti()\">XÁC NHẬN ĐÁP ÁN</button>\':\"\"}\${fb}<div class=\"actions\"><button class=\"secondary\" onclick=\"prev()\">← Câu trước</button>\${current<49?\'<button class=\"primary\" onclick=\"next()\">Câu tiếp →</button>\':\'<button class=\"danger\" onclick=\"submitExam()\">NỘP BÀI</button>\'}</div>\`;nav();document.querySelectorAll(\'input[name=a]\').forEach(i=>i.onchange=choose)}function choose(){let x=exam[current],multi=norm(x.answer).length>1;if(multi)return;if(event&&event.target)answers[current]=event.target.value;update();renderQuestion()}function confirmMulti(){answers[current]=[...document.querySelectorAll(\'input[name=a]:checked\')].map(i=>i.value).join(\",\");update();renderQuestion()}function go(i){current=i;renderQuestion()}function next(){if(!answers[current]){alert(\"Bạn chưa chọn đáp án.\");return}if(current<49){current++;renderQuestion()}}function prev(){if(current>0){current--;renderQuestion()}}function update(){let n=answers.filter(Boolean).length;document.getElementById(\"answered\").textContent=n;document.getElementById(\"bar\").style.width=n/50*100+\"%\"}function submitExam(){if(submitted)return;let left=50-answers.filter(Boolean).length;if(left&&!confirm(\"Còn \"+left+\" câu chưa trả lời. Vẫn nộp bài?\"))return;submitted=true;let s=exam.reduce((a,x,i)=>a+(isRight(norm(answers[i]),x)?1:0),0);document.getElementById(\"exam\").classList.add(\"hidden\");document.getElementById(\"result\").classList.remove(\"hidden\");document.getElementById(\"score\").textContent=s+\"/50\";document.getElementById(\"percent\").textContent=\"Tỷ lệ đúng: \"+(s/50*100).toFixed(1)+\"%\";showReview()}function showReview(){let b=document.getElementById(\"review\");b.classList.remove(\"hidden\");b.innerHTML=\'<h3>ĐÁP ÁN – GIẢI THÍCH – CĂN CỨ</h3>\'+exam.map((x,i)=>isRight(norm(answers[i]),x)?\"\":\`<div class=\"review\"><b>Câu \${i+1}: ✗ Sai</b><p>\${esc2(x.q)}</p><p>Đáp án đúng: <b>\${norm(x.answer).join(\", \")}</b></p><p>Giải thích: \${esc2(x.basis||\"\")}</p><p>Căn cứ: \${esc2(x.basis||\"\")}</p></div>\`).join(\"\")} }`}
async function run(){try{let t=await (await fetch("./bank.html?patch=20260819")).text();t=patchAnswers(t).replaceAll("30 câu","50 câu").replaceAll("0/30","0/50").replaceAll("/30","/50");t=t.replace(/<script>[\s\S]*?<\/script>/,"<script>"+appScript()+"<\/script>");t=t.replace(/\.question\{font-size:19px;/,".question{font-size:28px;");t=t.replace(/\.option\{display:block;padding:14px;/,".option{display:block;padding:17px;font-size:20px;");document.open();document.write(t);document.close()}catch(e){document.body.innerHTML="<h3 style='font-family:Arial;color:#07549a;text-align:center;padding:30px'>Không tải được ứng dụng. Hãy tải lại trang.</h3>"}}run();</script></body></html>
