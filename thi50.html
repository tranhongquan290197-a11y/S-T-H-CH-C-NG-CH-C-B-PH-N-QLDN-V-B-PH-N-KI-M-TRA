<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07549a"><title>Thi sát hạch – 50 câu</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#07549a;min-height:100vh;display:grid;place-items:center;text-align:center}.box{padding:24px}.spin{width:36px;height:36px;border:4px solid #d8e8f6;border-top-color:#07549a;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 15px}@keyframes r{to{transform:rotate(360deg)}}a{color:#07549a;font-weight:bold}</style></head><body><div class="box" id="box"><div class="spin"></div><b>Đang mở đề 50 câu...</b><p>Ngân hàng 735 câu</p></div><script>
const CH={"155":["D"],"170":["A"],"230":["A"],"355":["B"],"364":["C"],"416":["A","C"],"417":["A","B"],"419":["A","B"],"427":["A","D"],"431":["A"],"436":["A"],"437":["A"],"440":["D"],"442":["A","C"],"443":["C"],"444":["C"],"445":["B","C"],"446":["C"],"451":["A"],"452":["B","C"],"453":["A","C"],"454":["B","D"],"455":["C"],"511":["B"],"518":["C"],"525":["C"]};
function patchAnswers(t){for(const [id,a] of Object.entries(CH)){const re=new RegExp('(\\{\"id\":'+id+',.*?\"answer\":\")([^\"]+)(\")','s');t=t.replace(re,'$1'+a.join(',')+'$3')}return t}
async function openExam(){try{let r=await fetch('./bank.html?ver=20260819-50-fixed',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let t=await r.text();
// Cập nhật câu hỏi/đếm tiến độ từ 30 lên 50 nhưng giữ nguyên script ngân hàng để không làm mất biến BANK.
t=patchAnswers(t);
t=t.replaceAll('30 câu khác nhau','50 câu khác nhau').replaceAll('Danh sách 30 câu','Danh sách 50 câu').replaceAll('Đã trả lời: <span id="answered">0</span>/30','Đã trả lời: <span id="answered">0</span>/50');
t=t.replaceAll('slice(0,30)','slice(0,50)').replaceAll('current<29','current<49').replaceAll('current>29','current>49').replaceAll('30-Object.keys(answers).length','50-Object.keys(answers).length').replaceAll('n/30*100','n/50*100').replaceAll("s+'/30'","s+'/50'").replaceAll('s/30*100','s/50*100').replaceAll('CÂU ${current+1}/30','CÂU ${current+1}/50');
// Tăng chữ trên máy tính; điện thoại tự co theo media query của bank.html.
t=t.replace('</style>','@media(min-width:801px){.question{font-size:28px!important;line-height:1.55!important}.option{font-size:20px!important;padding:17px!important;line-height:1.55!important}.feedback{font-size:18px!important;line-height:1.6!important}}</style>');
document.open();document.write(t);document.close();
}catch(e){document.getElementById('box').innerHTML='<b>Không tải được ứng dụng thi.</b><p>Vui lòng bấm tải lại trang.</p><p style="font-size:13px;color:#607080">'+e.message+'</p><a href="./thi50.html?v=retry">Tải lại</a>'}}
openExam();
</script></body></html>
