<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07549a"><title>Thi sát hạch – 50 câu</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#07549a;min-height:100vh;display:grid;place-items:center;text-align:center}.box{padding:24px}.spin{width:36px;height:36px;border:4px solid #d8e8f6;border-top-color:#07549a;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 15px}@keyframes r{to{transform:rotate(360deg)}}a{color:#07549a;font-weight:bold}</style></head><body><div class="box"><div class="spin"></div><b>Đang mở đề 50 câu...</b><p>Ngân hàng 735 câu</p><noscript><a href="./bank.html">Bấm vào đây</a></noscript></div><script>fetch('./bank.html?source=excel-735-50').then(r=>r.text()).then(s=>{s=s.replaceAll('30 câu khác nhau','50 câu khác nhau').replaceAll('<b>30 câu</b>','<b>50 câu</b>').replaceAll('Đã trả lời: <span id="answered">0</span>/30','Đã trả lời: <span id="answered">0</span>/50').replaceAll('Danh sách 30 câu','Danh sách 50 câu').replaceAll('let exam=[],answers={},current=0,submitted=false','let exam=[],answers={},current=0,submitted=false');s=s.replace('exam=shuffle(BANK).slice(0,30)','exam=shuffle(BANK).slice(0,50)').replace('Array.from({length:30}','Array.from({length:50}').replace('current<29','current<49').replace('30-Object.keys(answers).length','50-Object.keys(answers).length').replace("n/30*100+'%'","n/50*100+'%'").replace("s+'/30'","s+'/50'").replace("s/30*100","s/50*100");document.open();document.write(s);document.close()}).catch(()=>{document.querySelector('.box').innerHTML='<b>Không tải được đề.</b><p>Hãy bấm tải lại trang.</p><a href="./thi50.html">Tải lại</a>'})</script></body></html>
